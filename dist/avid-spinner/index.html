<style>
*{box-sizing:border-box}body{margin:0;background:#fff9eb;color:#163354;font:20px/1.45 'Public Sans',Arial,sans-serif}main{max-width:1150px;margin:auto;padding:28px 22px 40px}header{text-align:center} .eyebrow{font-weight:800;letter-spacing:.16em;color:#75531a;font-size:15px}h1{font:800 clamp(36px,5vw,62px)/1 'Newsreader',Georgia,serif;margin:10px 0}header p{margin:12px 0 20px}.play{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:40px;align-items:center}.stage{position:relative;width:min(100%,540px);margin:20px auto 30px;aspect-ratio:1}.pointer{position:absolute;z-index:3;left:50%;top:-12px;transform:translateX(-50%);border-left:19px solid transparent;border-right:19px solid transparent;border-top:37px solid #163354;filter:drop-shadow(0 3px 0 white)}svg{display:block;width:100%;height:100%;overflow:visible}#wheel{transform-origin:270px 270px;transition:transform 4s cubic-bezier(.12,.7,.15,1)}.slice{stroke:#fff;stroke-width:5}.wheel-label{font:800 20px 'Public Sans',Arial,sans-serif;fill:#163354;text-anchor:middle}.emoji{font-size:39px}.hub{fill:#fff;stroke:#163354;stroke-width:5}.hub-label{font:800 27px 'Newsreader',Georgia,serif;fill:#163354;text-anchor:middle}.controls{text-align:center}button{font:800 23px 'Public Sans',Arial,sans-serif;background:#6b359a;color:#fff;border:0;border-radius:16px;padding:16px 30px;min-height:62px;box-shadow:0 5px 0 #43215e;cursor:pointer}button:hover{background:#57287f}button:disabled{opacity:.7;cursor:wait}button:focus-visible{outline:4px solid #147b8a;outline-offset:6px}.instructions{border-top:8px solid #efb93f;padding:25px 0}.instructions .kicker{font-weight:800;color:#68408c;font-size:15px;letter-spacing:.12em;text-transform:uppercase}h2{font:800 clamp(32px,4vw,46px)/1.05 'Newsreader',Georgia,serif;margin:12px 0 18px}.instructions p{font-size:23px}.steps{padding-left:27px;font-size:23px}.steps li{margin:13px 0}.cheer{border-top:2px dashed #c8bba0;padding-top:18px;font-weight:700}.legend{font-size:16px;color:#526277;margin-top:18px}.badge{font-size:54px;margin-bottom:5px}footer{text-align:center;font-size:16px;color:#526277;margin-top:24px}@media(max-width:760px){.play{grid-template-columns:1fr;gap:15px}.stage{max-width:470px}.instructions{padding-top:15px}main{padding:22px 16px}.instructions p,.steps{font-size:21px}}@media(prefers-reduced-motion:reduce){#wheel{transition:none}}
</style><link rel="stylesheet" href="homebase-theme.css?v=20261115-uniform-2">
<style>#wheel{transition:none!important}.pointer{transform-origin:50% 0}.spoke-peg{fill:#e3ad35;stroke:#17365d;stroke-width:2;pointer-events:none}</style><style>
body.hb-site[data-hb-page="elementary"]{background:#f7fbff;background-image:radial-gradient(#d4e2ef 1px,transparent 1px);background-size:22px 22px}

body.hb-site[data-hb-page="elementary"] h1{font-family:'Public Sans',Arial,sans-serif;font-weight:800;letter-spacing:-.045em;font-size:clamp(32px,4.5vw,52px);color:#17365d;margin-top:16px}

</style><link rel="stylesheet" href="../school-nav.css"></head><body class="hb-site" data-hb-page="elementary"><nav class="school-return" aria-label="School website"><a href="../">OCS Resources</a><span>OCS Elementary Resources</span></nav><main><header><div class="eyebrow">AVID</div><h1>OCS Elementary Organization</h1></header><div class="play"><div><div class="stage"><div class="pointer" aria-hidden="true"></div><svg viewBox="0 0 540 540" role="img" aria-label="Organization wheel: desk and seat back pockets, binder, planner, backpack, and pencil box"><g id="wheel"></g><circle class="hub" cx="270" cy="270" r="55"/><text class="hub-label" x="270" y="279">OCS</text></svg></div><div class="controls"><button id="spin" type="button">🎡 Spin the wheel!</button></div></div><section class="instructions" aria-live="polite" aria-atomic="true"><div class="kicker">Organization check</div><div id="mission"><h2>Spin to choose a check</h2><p>Your teacher will spin to pick one spot for everyone to organize.</p></div><p class="cheer">Finished? Give a quiet thumbs-up! 👍</p></section></div></main><script>
const tasks=[
{name:'Desk & seat back pockets',lines:['Desk & seat','back pockets'],icon:'🪑',color:'#80d6e6',steps:['Check your desk and seat back pockets.','Put papers in the correct folder. Keep only what belongs here.','Recycle scraps and leave your learning space neat.']},
{name:'Binder',lines:['Binder'],icon:'📒',color:'#c7a5eb',steps:['Open your binder and look for loose papers.','Put each paper in the right folder or section.','Close the binder rings carefully.']},
{name:'Planner',lines:['Planner'],icon:'📅',color:'#ffb9bc',steps:['Find your planner and open to this week.','Check your reminders and homework with your teacher.','Put your planner where you can find it again.']},
{name:'Backpack',lines:['Backpack'],icon:'🎒',color:'#ffd36b',steps:['Open your backpack and check each pocket.','Put school supplies and papers in their places.','Remove trash and zip up your backpack.']},
{name:'Pencil box',lines:['Pencil box'],icon:'✏️',color:'#9cdfaa',steps:['Open your pencil box and take a quick look.','Put pencils, crayons, and erasers together neatly.','Close it carefully so your tools stay safe.']}
];
const ns='http://www.w3.org/2000/svg',wheel=document.getElementById('wheel'),button=document.getElementById('spin');let rotation=0,spinning=false;
function svgEl(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;return e}
function point(a,r){const t=(a-90)*Math.PI/180;return [270+r*Math.cos(t),270+r*Math.sin(t)]}
tasks.forEach((task,i)=>{const a=i*72,b=a+72,[x1,y1]=point(a,255),[x2,y2]=point(b,255);wheel.append(svgEl('path',{d:'M270 270 L'+x1+' '+y1+' A255 255 0 0 1 '+x2+' '+y2+' Z',fill:task.color,class:'slice'}));const [x,y]=point(a+36,167);wheel.append(svgEl('text',{x,y:y-15,class:'wheel-label emoji'},task.icon));task.lines.forEach((line,j)=>wheel.append(svgEl('text',{x,y:y+20+j*23,class:'wheel-label'},line)))});
function choose(){const a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=4294967295);return a[0]%5}

const pointer=document.querySelector('.pointer');let audioContext=null,lastClick=-Infinity;
for(let i=0;i<25;i++){const [x,y]=point(i*360/25,251);wheel.append(svgEl('circle',{cx:x,cy:y,r:5,class:'spoke-peg','aria-hidden':'true'}))}
    function initAudio(){try{const Audio=window.AudioContext||window.webkitAudioContext;if(Audio&&!audioContext)audioContext=new Audio();if(audioContext&&audioContext.state==='suspended')audioContext.resume().catch(()=>{})}catch(error){audioContext=null}}
    function tone(frequency,duration,volume,type='sine',delay=0){if(!audioContext||audioContext.state!=='running')return;try{const now=audioContext.currentTime+delay,osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type=type;osc.frequency.setValueAtTime(frequency,now);gain.gain.setValueAtTime(volume,now);gain.gain.exponentialRampToValueAtTime(.001,now+duration);osc.connect(gain);gain.connect(audioContext.destination);osc.start(now);osc.stop(now+duration);osc.onended=()=>{osc.disconnect();gain.disconnect()}}catch(error){}}
    function clickSpoke(now,reduced){if(!reduced)pointer.animate([{transform:'translateX(-50%) rotate(-15deg)'},{transform:'translateX(-50%) rotate(0deg)'}],{duration:85,easing:'ease-out'});if(now-lastClick>28){tone(1250,.025,.045,'triangle');lastClick=now}}

function celebrate(index,icon){document.querySelector('.selected-outline')?.remove();const shape=wheel.querySelectorAll('.slice')[index];const outline=svgEl('path',{d:shape.getAttribute('d'),class:'selected-outline','aria-hidden':'true'});wheel.append(outline);if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;icon.animate([{transform:'translateY(0) rotate(0deg)'},{transform:'translateY(-14px) rotate(-8deg)',offset:.35},{transform:'translateY(0) rotate(5deg)',offset:.65},{transform:'translateY(0) rotate(0deg)'}],{duration:650,easing:'ease-out'});const burst=document.createElement('div');burst.className='confetti';burst.setAttribute('aria-hidden','true');document.querySelector('.instructions').append(burst);for(let i=0;i<12;i++){const piece=document.createElement('span');piece.textContent=i%3===0?'✏️':i%3===1?'📄':'▰';piece.style.color=['#e3ad35','#81bbd6','#bb2649'][i%3];piece.style.left=(20+Math.random()*60)+'%';piece.style.top='12%';burst.append(piece);piece.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:'translate('+((Math.random()-.5)*230)+'px,'+(100+Math.random()*140)+'px) rotate('+((Math.random()-.5)*300)+'deg)',opacity:0}],{duration:850+Math.random()*350,easing:'cubic-bezier(.15,.6,.4,1)',fill:'forwards'})}setTimeout(()=>burst.remove(),1250)}
function showMission(index){const task=tasks[index],mission=document.getElementById('mission');mission.replaceChildren();const icon=document.createElement('div');icon.className='badge';icon.setAttribute('aria-hidden','true');icon.textContent=task.icon;const title=document.createElement('h2');title.textContent=task.name;const steps=document.createElement('ol');steps.className='steps';task.steps.forEach(text=>{const li=document.createElement('li');li.textContent=text;steps.append(li)});mission.append(icon,title,steps);celebrate(index,icon);spinning=false;button.disabled=false;button.textContent='🎡 Spin again!';tone(523.25,.25,.07);tone(659.25,.3,.07,'sine',.12);tone(783.99,.45,.07,'sine',.24)}
button.addEventListener('click',()=>{if(spinning)return;document.querySelector('.selected-outline')?.remove();document.querySelector('.confetti')?.remove();spinning=true;initAudio();button.disabled=true;button.textContent='Spinning…';const index=choose(),target=(360-(index*72+36))%360,from=rotation,to=from+(20+Math.floor(Math.random()*5))*360+((target-from%360+360)%360),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,duration=reduced?200:10000,start=performance.now();let lastSpoke=Math.floor(from/14.4);
function frame(now){const progress=Math.min(1,(now-start)/duration),value=from+(to-from)*(1-Math.pow(1-progress,4));wheel.style.transform='rotate('+value+'deg)';const spoke=Math.floor(value/14.4);if(spoke!==lastSpoke){if(!reduced)clickSpoke(now,false);lastSpoke=spoke}if(progress<1)requestAnimationFrame(frame);else{rotation=to;wheel.style.transform='rotate('+rotation+'deg)';showMission(index)}}requestAnimationFrame(frame)});
</script></body></html>
