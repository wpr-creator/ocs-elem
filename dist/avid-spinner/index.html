<header class="activity-header"><div class="wrap header-inner"><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="brand-name">OCS Elementary</span></div></div></header>
<main class="wrap">
<section class="page-intro"><h1>AVID Organization <span>Spinner</span></h1><p>Spin the wheel. Then follow the steps to organize your things.</p></section>
<div class="play">
<section class="wheel-panel" id="wheel-panel" aria-label="Organization spinner" aria-busy="false"><div class="stage"><div class="pointer" aria-hidden="true"></div><svg viewBox="0 0 540 540" role="img" aria-label="Organization wheel: desk and seat back pockets, binder, planner, backpack, and pencil box"><g id="wheel"></g><circle class="hub" cx="270" cy="270" r="55"/><text class="hub-label" x="270" y="279">OCS</text></svg></div><div class="controls"><button id="spin" type="button">Spin the wheel</button><button id="skip-spin" class="secondary" type="button" hidden>Show result</button></div></section>
<section class="instructions" ><div class="kicker">Today’s check</div><div id="mission"><div class="ready-icon" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="6" width="25" height="30" rx="5"/><path d="m13 16 2 2 4-5m3 3h6m-15 9 2 2 4-5m3 3h6"/></svg></div><h2>Spin to choose a check</h2></div><button type="button" class="activity-read" id="read-steps" data-read aria-pressed="false" hidden>Read steps</button><p class="cheer"><span aria-hidden="true">👍</span> Finished? Give a quiet thumbs-up!</p></section>
</div>
<div id="spin-status" class="sr-only" role="status" aria-live="polite"></div></main>
